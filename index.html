<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忠欣蔬果內部系統</title>
<link rel="icon" href="shared/logo-teruteru.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 28px 64px; }

  /* 頁首：歡迎詞＋右側動作 */
  .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .top h1 { margin: 0; font-size: 24px; }
  .top p { margin: 4px 0 0; color: var(--zx-text-2); font-size: 14px; }
  .top .actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .top .actions a.zx-btn { text-decoration: none; }

  .card { background: var(--zx-surface); border: 1px solid var(--zx-border); border-radius: var(--radius-card);
          box-shadow: var(--zx-shadow); padding: 20px; min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-h h2 { margin: 0; font-size: 16px; }
  .card-h .sub { color: var(--zx-text-3); font-size: 13px; }
  .card-h .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .link { color: var(--zx-primary-ink); font-weight: 600; font-size: 13px; text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .kpi { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
         transition: border-color var(--dur), box-shadow var(--dur); }
  .kpi:hover { border-color: var(--zx-border-strong); box-shadow: var(--zx-shadow-hover); }
  .kpi:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .kpi .label { display: flex; align-items: center; gap: 10px; color: var(--zx-text-2); font-size: 14px; font-weight: 500; }
  .kpi .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none;
              background: var(--zx-primary-soft); color: var(--zx-primary-ink); }
  .kpi .ico.red { background: #FDECEA; color: #B4231E; }
  .kpi .ico.amber { background: var(--biz-warn-bg); color: #8A5300; }
  .kpi .val { font: 700 30px/1.1 var(--font-body); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .val small { font-size: 16px; font-weight: 600; color: var(--zx-text-3); margin-left: 2px; }
  .kpi .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--zx-text-3); }
  .delta { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 12.5px; }
  .delta.good { background: var(--zx-primary-soft); color: var(--zx-primary-ink); }
  .delta.bad { background: #FDECEA; color: #B4231E; }
  .delta.flat { background: var(--zx-surface-2); color: var(--zx-text-2); }

  /* 第二列：趨勢＋今日進度 */
  .row2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 16px; margin-bottom: 16px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--zx-surface-2); border: 1px solid var(--zx-border); }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font: 600 13px var(--font-body);
                color: var(--zx-text-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--zx-surface); color: var(--zx-text); box-shadow: var(--zx-shadow); }
  .seg button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--zx-text-2); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; }
  .legend i.dash { border-top-style: dashed; }
  .chart { position: relative; height: 280px; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .chart .grid line { stroke: var(--zx-border); }
  .chart .axis text { fill: var(--zx-text-3); font: 500 11.5px var(--font-body); }
  .chart .end text { font: 600 12px var(--font-body); fill: var(--zx-text-2); }
  .tip { position: absolute; pointer-events: none; background: var(--zx-surface); border: 1px solid var(--zx-border);
         box-shadow: var(--zx-shadow-pop); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; white-space: nowrap;
         transform: translate(-50%, calc(-100% - 12px)); z-index: 5; }
  .tip[hidden] { display: none; }
  .tip b { display: block; font-size: 13px; margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 6px; color: var(--zx-text-2); }
  .tip .r i { width: 10px; height: 0; border-top: 2px solid; }
  .tip .r i.dash { border-top-style: dashed; }
  .tip .r em { font-style: normal; font-weight: 600; color: var(--zx-text); margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .table-toggle { border: 0; background: none; color: var(--zx-primary-ink); font: 600 13px var(--font-body); cursor: pointer; padding: 4px 0; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .data-table th, .data-table td { padding: 6px 8px; border-bottom: 1px solid var(--zx-border); text-align: right; font-variant-numeric: tabular-nums; }
  .data-table th:first-child, .data-table td:first-child { text-align: left; }
  .data-table th { color: var(--zx-text-2); font-weight: 600; background: var(--zx-surface-2); }
  .table-wrap { max-height: 240px; overflow: auto; }

  .meter { display: flex; align-items: center; gap: 18px; }
  .meter svg { width: 132px; height: 132px; flex: none; }
  .meter .pct { font: 700 26px var(--font-body); fill: var(--zx-text); }
  .meter .cap { font: 500 11.5px var(--font-body); fill: var(--zx-text-3); }
  .breakdown { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; flex: 1; min-width: 0; font-size: 13.5px; }
  .breakdown li { display: flex; align-items: center; gap: 8px; color: var(--zx-text-2); }
  .breakdown li i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .breakdown li b { margin-left: auto; color: var(--zx-text); font-variant-numeric: tabular-nums; }
  .divider { height: 1px; background: var(--zx-border); margin: 18px 0 14px; }
  .series { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .series .nm { display: flex; font-size: 13.5px; margin-bottom: 5px; }
  .series .nm b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .series .nm b span { color: var(--zx-text-3); font-weight: 500; }
  .bar { height: 8px; border-radius: 999px; background: var(--zx-surface-2); border: 1px solid var(--zx-border); overflow: hidden; }
  .bar > div { height: 100%; background: var(--zx-primary); border-radius: 999px; min-width: 0; }
  .muted { color: var(--zx-text-3); font-size: 13px; }

  /* 最新異常 */
  .latest { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .ab { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; padding: 16px; }
  .ab:hover { border-color: var(--zx-border-strong); box-shadow: var(--zx-shadow-hover); }
  .ab .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--zx-text-3); }
  .ab .meta .chip { margin-left: auto; }
  .chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
          background: var(--biz-abnormal-bg); color: #B4231E; white-space: nowrap; }
  .chip.blue { background: var(--biz-handover-bg); color: #1D5BB5; }
  .ab h3 { margin: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ab p { margin: 0; color: var(--zx-text-2); font-size: 13.5px; line-height: 1.5;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ab .car { font-size: 12.5px; color: var(--zx-text-3); margin-top: auto; }
  .empty { padding: 28px; text-align: center; color: var(--zx-text-3); grid-column: 1 / -1; }
  .skeleton .val, .skeleton .foot { color: transparent; }
  footer { margin-top: 32px; color: var(--zx-text-3); font-size: 12.5px; text-align: center; }

  @media (max-width: 1180px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row2 { grid-template-columns: minmax(0, 1fr); }
    .latest { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    main { padding: 16px 16px 48px; }
    .top h1 { font-size: 20px; }
    .top .actions { margin-left: 0; width: 100%; }
    .kpis, .latest { grid-template-columns: minmax(0, 1fr); }
    .kpi .val { font-size: 26px; }
    .meter { flex-direction: column; align-items: stretch; }
    .meter svg { align-self: center; }
    .chart { height: 220px; }
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared/zx-nav.js" data-site="home" data-root="./"></script>
<script src="shared/zx-config.js"></script>
<script src="shared/zx-sync.js"></script>
<script src="shared/zx-auth.js"></script>

<main id="dash">
  <header class="top">
    <div>
      <h1 id="hello">歡迎回來 👋</h1>
      <p id="today-line">讀取中…</p>
    </div>
    <div class="actions">
      <span id="zx-sync-badge" class="sync-badge" data-state="pending" role="status" aria-live="polite">連線中…</span>
      <a class="zx-btn" id="continue" href="#" hidden>繼續使用上次的系統</a>
      <a class="zx-btn zx-btn--primary" href="report/">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增異常紀錄</a>
      <span id="zx-user-chip"></span>
    </div>
  </header>

  <section class="kpis skeleton" id="kpis" aria-label="今日重點">
    <a class="card kpi" href="tick/" id="k-tick">
      <span class="label"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 5-5.5"/></svg></span>今日已叫貨</span>
      <span class="val">0<small>/ 0</small></span>
      <span class="foot">—</span>
    </a>
    <a class="card kpi" href="tick/" id="k-warn">
      <span class="label"><span class="ico amber"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>三天未叫</span>
      <span class="val">0<small>家</small></span>
      <span class="foot">—</span>
    </a>
    <a class="card kpi" href="report/" id="k-ab">
      <span class="label"><span class="ico red"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3.5 19h17z"/><path d="M12 10v4.5M12 17.2v.3"/></svg></span>近 7 天異常</span>
      <span class="val">0<small>筆</small></span>
      <span class="foot">—</span>
    </a>
    <a class="card kpi" href="quote/" id="k-quote">
      <span class="label"><span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h7l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V8h4.5M8.5 12.5h7M8.5 16h7"/></svg></span>報價可批次匯出</span>
      <span class="val">0<small>家</small></span>
      <span class="foot">—</span>
    </a>
  </section>

  <section class="row2">
    <div class="card">
      <div class="card-h">
        <h2 id="trend-title">叫貨趨勢</h2>
        <span class="sub">每個營業日的客戶家數</span>
        <div class="right">
          <div class="seg" role="group" aria-label="期間">
            <button type="button" data-days="30" aria-pressed="true">30 天</button>
            <button type="button" data-days="14" aria-pressed="false">14 天</button>
            <button type="button" data-days="7" aria-pressed="false">7 天</button>
          </div>
        </div>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="border-color:var(--c-ord)"></i>已叫貨</span>
        <span><i class="dash" style="border-color:var(--c-un)"></i>未叫貨</span>
      </div>
      <div class="chart" id="chart" role="img" aria-labelledby="trend-title"></div>
      <button type="button" class="table-toggle" id="table-toggle" aria-expanded="false" aria-controls="trend-table">顯示資料表</button>
      <div class="table-wrap" id="trend-table" hidden></div>
    </div>

    <div class="card">
      <div class="card-h"><h2>今日叫貨進度</h2><a class="link right" href="tick/">開啟打勾單 →</a></div>
      <div class="meter">
        <svg viewBox="0 0 132 132" id="meter" aria-hidden="true"></svg>
        <ul class="breakdown" id="breakdown"></ul>
      </div>
      <div class="divider"></div>
      <div class="card-h" style="margin-bottom:10px"><h2 style="font-size:14px">系列叫貨</h2><span class="sub">已叫貨 / 店家數</span></div>
      <ul class="series" id="series"><li class="muted">讀取中…</li></ul>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><h2>最新異常紀錄</h2><span class="sub" id="ab-today-line"></span><a class="link right" href="report/">查看全部 →</a></div>
    <div class="latest" id="latest"><div class="empty">讀取中…</div></div>
  </section>

  <footer>忠欣蔬果有限公司・內部使用・資料每次異動即時更新</footer>
</main>

<script>
(function () {
  'use strict';
  // 圖表配色：已叫貨＝主色綠（實線）、未叫貨＝磚紅（虛線）。已用 dataviz validate_palette.js 檢查（淺色底全數通過）
  document.documentElement.style.setProperty('--c-ord', '#15805A');
  document.documentElement.style.setProperty('--c-un', '#C2410C');
  var C_ORD = '#15805A', C_UN = '#C2410C', C_NO = '#2D79E4', C_TRACK = '#E3E8E5';
  var REFRESH_MIN_MS = 60000;            // 有異動時最快 60 秒重抓一次彙總（約 3 KB），控制流量
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var esc = function (s) { return ZX.esc(s); };
  var data = null, range = 30, lastFetch = 0, refreshTimer = null;

  (function continueLink() {
    var LABEL = { tick: '打勾單', report: '異常表與交接表', quote: '報價單匯出' }, last = null;
    try { last = localStorage.getItem('zx-last-site'); } catch (e) {}
    if (last && LABEL[last]) {
      var a = document.getElementById('continue');
      a.href = last + '/'; a.textContent = '繼續使用「' + LABEL[last] + '」'; a.hidden = false;
    }
  })();

  function fmtDate(iso, withWd) {
    if (!iso) return '—';
    var d = new Date(iso + 'T00:00:00');
    return (d.getMonth() + 1) + '/' + d.getDate() + (withWd ? '（' + WD[d.getDay()] + '）' : '');
  }
  function delta(cur, prev, upIsGood) {
    if (!prev) return cur ? '' : '<span class="delta flat">持平</span>';
    var p = Math.round((cur - prev) / prev * 100);
    if (p === 0) return '<span class="delta flat">持平</span>';
    var good = upIsGood ? p > 0 : p < 0;
    return '<span class="delta ' + (good ? 'good' : 'bad') + '">' + (p > 0 ? '▲ ' : '▼ ') + Math.abs(p) + '%</span>';
  }

  function renderKpis() {
    var t = data.tick, r = data.report, q = data.quote;
    var pct = t.total ? Math.round(t.ord / t.total * 100) : 0;
    var set = function (id, val, unit, foot) {
      var el = document.getElementById(id);
      el.querySelector('.val').innerHTML = val + '<small>' + unit + '</small>';
      el.querySelector('.foot').innerHTML = foot;
    };
    set('k-tick', t.ord, '/ ' + t.total, '<span class="delta flat">完成 ' + pct + '%</span>' +
        (data.prev_date ? '前一營業日共 ' + t.prev_ord + ' 家' : ''));
    set('k-warn', t.warn3, '家', '連續 3 個工作天未叫貨');
    set('k-ab', r.ab_7d, '筆', delta(r.ab_7d, r.ab_prev_7d, false) + '較前 7 天（' + r.ab_prev_7d + ' 筆）');
    set('k-quote', q.ready, '家', '待上傳 ' + q.pending + '・待設定格式 ' + q.setup);
    document.getElementById('kpis').classList.remove('skeleton');
    document.getElementById('today-line').textContent = data.service_date
      ? '目前營業日 ' + fmtDate(data.service_date, true) + '・今天有 ' + r.ab_today + ' 筆異常、' + r.ho_today + ' 筆交接'
      : '尚未開始營業日';
    document.getElementById('ab-today-line').textContent = '今日 ' + r.ab_today + ' 筆・昨日 ' + r.ab_prev + ' 筆';
  }

  /* ---------- 趨勢折線圖（單一 Y 軸、2px 線、十字線＋提示框、端點直接標示） ---------- */
  function rows() {
    var total = data.tick.total;
    return data.trend.slice(-range).map(function (x) {
      return { d: x.d, ord: x.ord, un: Math.max(0, total - x.ord - x.no), no: x.no, open: x.open };
    });
  }
  function niceMax(v) {
    if (v <= 4) return 4;
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function renderChart() {
    var box = document.getElementById('chart');
    var R = rows();
    if (!R.length) { box.innerHTML = '<div class="empty">還沒有營業日資料</div>'; renderTable(R); return; }
    var W = box.clientWidth, H = box.clientHeight;
    var m = { l: 36, r: 64, t: 10, b: 26 };
    var iw = Math.max(10, W - m.l - m.r), ih = H - m.t - m.b;
    var max = niceMax(Math.max.apply(null, R.map(function (x) { return Math.max(x.ord, x.un); })) || 1);
    var x = function (i) { return m.l + (R.length === 1 ? iw / 2 : i * iw / (R.length - 1)); };
    var y = function (v) { return m.t + ih - v / max * ih; };
    var path = function (k) { return R.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[k]).toFixed(1); }).join(''); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    s += '<g class="grid">';
    for (var g = 0; g <= 4; g++) {
      var gy = y(max * g / 4);
      s += '<line x1="' + m.l + '" x2="' + (m.l + iw) + '" y1="' + gy + '" y2="' + gy + '"' + (g ? ' stroke-dasharray="3 4"' : '') + '/>';
    }
    s += '</g><g class="axis">';
    for (g = 0; g <= 4; g++) s += '<text x="' + (m.l - 8) + '" y="' + (y(max * g / 4) + 4) + '" text-anchor="end">' + Math.round(max * g / 4) + '</text>';
    var step = Math.max(1, Math.ceil(R.length / Math.max(2, Math.floor(iw / 64))));
    R.forEach(function (p, i) {
      if (i % step === 0 || i === R.length - 1) s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + fmtDate(p.d) + '</text>';
    });
    s += '</g>';
    s += '<path d="' + path('un') + '" fill="none" stroke="' + C_UN + '" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<path d="' + path('ord') + '" fill="none" stroke="' + C_ORD + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    // 端點直接標示（今天若仍進行中，以空心點表示尚未結束）
    var L = R.length - 1, last = R[L];
    var ly1 = y(last.ord), ly2 = y(last.un);
    if (Math.abs(ly1 - ly2) < 16) { var mid = (ly1 + ly2) / 2; ly1 = mid + (last.ord >= last.un ? -9 : 9); ly2 = mid + (last.ord >= last.un ? 9 : -9); }
    s += '<g class="end">';
    [['ord', C_ORD, ly1, '已叫'], ['un', C_UN, ly2, '未叫']].forEach(function (e) {
      s += '<circle cx="' + x(L) + '" cy="' + y(last[e[0]]) + '" r="4.5" fill="' + (last.open ? '#fff' : e[1]) + '" stroke="' + e[1] + '" stroke-width="2"/>';
      s += '<text x="' + (x(L) + 10) + '" y="' + (e[2] + 4) + '">' + e[3] + ' ' + last[e[0]] + '</text>';
    });
    s += '</g>';
    s += '<g id="hover" visibility="hidden"><line id="hx" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="#9AA6A0" stroke-width="1"/>' +
         '<circle id="h1" r="5" fill="' + C_ORD + '" stroke="#fff" stroke-width="2"/><circle id="h2" r="5" fill="' + C_UN + '" stroke="#fff" stroke-width="2"/></g>';
    s += '<rect x="' + m.l + '" y="0" width="' + iw + '" height="' + H + '" fill="transparent" id="hit"/></svg>';
    s += '<div class="tip" id="tip" hidden></div>';
    box.innerHTML = s;
    box.setAttribute('aria-label', '叫貨趨勢折線圖，近 ' + R.length + ' 個營業日；最新一天已叫貨 ' + last.ord + ' 家、未叫貨 ' + last.un + ' 家');

    var hit = box.querySelector('#hit'), hov = box.querySelector('#hover'), tip = box.querySelector('#tip');
    function show(evt) {
      var rect = box.getBoundingClientRect();
      var px = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
      var i = R.length === 1 ? 0 : Math.round((px - m.l) / iw * (R.length - 1));
      i = Math.max(0, Math.min(R.length - 1, i));
      var p = R[i];
      hov.setAttribute('visibility', 'visible');
      box.querySelector('#hx').setAttribute('x1', x(i)); box.querySelector('#hx').setAttribute('x2', x(i));
      box.querySelector('#h1').setAttribute('cx', x(i)); box.querySelector('#h1').setAttribute('cy', y(p.ord));
      box.querySelector('#h2').setAttribute('cx', x(i)); box.querySelector('#h2').setAttribute('cy', y(p.un));
      tip.innerHTML = '<b>' + fmtDate(p.d, true) + (p.open ? '・進行中' : '') + '</b>' +
        '<div class="r"><i style="border-color:' + C_ORD + '"></i>已叫貨<em>' + p.ord + ' 家</em></div>' +
        '<div class="r"><i class="dash" style="border-color:' + C_UN + '"></i>未叫貨<em>' + p.un + ' 家</em></div>' +
        (p.no ? '<div class="r"><i style="border-color:transparent"></i>今日不叫貨<em>' + p.no + ' 家</em></div>' : '');
      tip.hidden = false;
      var tx = Math.max(80, Math.min(W - 80, x(i)));
      tip.style.left = tx + 'px';
      tip.style.top = Math.min(y(p.ord), y(p.un)) + 'px';
    }
    function hide() { hov.setAttribute('visibility', 'hidden'); tip.hidden = true; }
    hit.addEventListener('mousemove', show);
    hit.addEventListener('touchstart', show, { passive: true });
    hit.addEventListener('touchmove', show, { passive: true });
    hit.addEventListener('mouseleave', hide);
    renderTable(R);
  }
  function renderTable(R) {
    document.getElementById('trend-table').innerHTML =
      '<table class="data-table"><thead><tr><th scope="col">營業日</th><th scope="col">已叫貨</th><th scope="col">未叫貨</th><th scope="col">今日不叫貨</th></tr></thead><tbody>' +
      R.slice().reverse().map(function (p) {
        return '<tr><td>' + fmtDate(p.d, true) + (p.open ? '（進行中）' : '') + '</td><td>' + p.ord + '</td><td>' + p.un + '</td><td>' + p.no + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* ---------- 今日進度：單一數值的環形量表（非分類圓餅）＋狀態分解＋系列長條 ---------- */
  function renderProgress() {
    var t = data.tick, un = Math.max(0, t.total - t.ord - t.no);
    var pct = t.total ? t.ord / t.total : 0, r = 54, c = 2 * Math.PI * r;
    document.getElementById('meter').innerHTML =
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + C_TRACK + '" stroke-width="12"/>' +
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + C_ORD + '" stroke-width="12" stroke-linecap="round"' +
      ' stroke-dasharray="' + (pct * c).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 66 66)"' + (pct ? '' : ' visibility="hidden"') + '/>' +
      '<text class="pct" x="66" y="68" text-anchor="middle">' + Math.round(pct * 100) + '%</text>' +
      '<text class="cap" x="66" y="88" text-anchor="middle">已叫貨</text>';
    document.getElementById('breakdown').innerHTML =
      '<li><i style="background:' + C_ORD + '"></i>已叫貨<b>' + t.ord + '</b></li>' +
      '<li><i style="background:' + C_NO + '"></i>今日不叫貨<b>' + t.no + '</b></li>' +
      '<li><i style="background:' + C_TRACK + ';border:1px solid #CFD8D3"></i>未叫貨<b>' + un + '</b></li>' +
      '<li><i style="background:var(--biz-warn)"></i>其中三天未叫<b>' + t.warn3 + '</b></li>';
    var S = data.series.filter(function (s) { return s.total > 0; });
    document.getElementById('series').innerHTML = S.length ? S.map(function (s) {
      var p = Math.round(s.ord / s.total * 100);
      return '<li><div class="nm">' + esc(s.name) + '<b>' + s.ord + ' <span>/ ' + s.total + '</span></b></div>' +
        '<div class="bar" role="img" aria-label="' + esc(s.name) + ' 已叫貨 ' + s.ord + ' / ' + s.total + ' 家（' + p + '%）"><div style="width:' + p + '%"></div></div></li>';
    }).join('') : '<li class="muted">目前名單中沒有符合系列規則的店家</li>';
  }

  function renderLatest() {
    var L = data.report.latest || [];
    document.getElementById('latest').innerHTML = L.length ? L.map(function (a) {
      var tag = a.exchange_type || a.category;
      return '<a class="card ab" href="report/">' +
        '<div class="meta"><span>' + esc(a.report_date ? fmtDate(a.report_date, true) : (a.date || '')) + '</span>' +
        (tag ? '<span class="chip">' + esc(tag) + '</span>' : '') + '</div>' +
        '<h3>' + esc(a.store || '（未填店家）') + '</h3>' +
        '<p>' + esc(a.reason || '（未填原因）') + '</p>' +
        '<div class="car">' + (a.car_no ? '車號 ' + esc(a.car_no) : '未填車號') + '</div></a>';
    }).join('') : '<div class="empty">目前沒有異常紀錄</div>';
  }

  function renderAll() { renderKpis(); renderChart(); renderProgress(); renderLatest(); }

  async function load() {
    lastFetch = Date.now();
    var r = await window.sb.rpc('dashboard_summary', { p_days: 30 });
    if (r.error) throw r.error;
    data = r.data;
    renderAll();
  }
  // 收到任一站的異動：最快每 60 秒重抓一次彙總，避免打勾高峰時每勾一次就重抓
  function scheduleRefresh() {
    if (refreshTimer) return;
    var wait = Math.max(0, lastFetch + REFRESH_MIN_MS - Date.now());
    refreshTimer = setTimeout(function () {
      refreshTimer = null;
      load().catch(function (e) { console.error('[dashboard]', e); ZX.syncBadge('error'); });
    }, wait);
  }

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      range = +b.dataset.days;
      document.querySelectorAll('.seg button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      if (data) renderChart();
    });
  });
  document.getElementById('table-toggle').addEventListener('click', function () {
    var t = document.getElementById('trend-table'), open = t.hidden;
    t.hidden = !open; this.setAttribute('aria-expanded', String(open));
    this.textContent = open ? '隱藏資料表' : '顯示資料表';
  });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (data) renderChart(); }, 120); });

  ZX.boot({
    site: 'home', title: '忠欣蔬果內部系統', logo: 'shared/logo-teruteru.svg',
    onReady: async function (ctx) {
      var name = ctx.member.display_name || ctx.user.email.split('@')[0];
      document.getElementById('hello').textContent = '歡迎回來，' + name + ' 👋';
      var syncer = zxSync.createSync({
        sb: ctx.sb, sites: ['tick', 'report', 'quote'],
        onChange: scheduleRefresh, onReset: scheduleRefresh,
        onStatus: function (s) { ZX.syncBadge(s); }
      });
      await syncer.start(load);
    }
  });
})();
</script>
</body>
</html>
