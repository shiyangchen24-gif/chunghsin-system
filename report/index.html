<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異常表與交接表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  :root{
    --bg: #F6F6F8;
    --surface: #FFFFFF;
    --surface-2: #EFEFF2;
    --border: #E3E3E8;
    --border-strong: #D2D2D9;
    --text: #16161A;
    --text-soft: #6D6D78;
    --text-faint: #A1A1AA;

    --abnormal: #E93E38;
    --abnormal-soft: #FFE4E4;
    --abnormal-line: rgba(233, 62, 56, 0.35);

    --handover: #2D79E4;
    --handover-soft: #E5EFFE;
    --handover-line: rgba(45, 121, 228, 0.35);

    --accent: var(--abnormal);
    --accent-soft: var(--abnormal-soft);
    --accent-line: var(--abnormal-line);

    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(15,15,20,0.05);
    --shadow-md: 0 4px 16px rgba(15,15,20,0.06), 0 1px 3px rgba(15,15,20,0.04);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }

  .mono{ font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace; }

  header{
    background: rgba(246,246,248,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .mark{
    width: 36px; height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--abnormal-soft), var(--handover-soft));
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .brand .mark img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px;
    box-sizing: border-box;
  }

  .brand h1{
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.2;
  }

  .brand .sub{
    font-size: 13px;
    color: var(--text-faint);
    font-weight: 500;
  }

  .tabs{
    display: inline-flex;
    gap: 2px;
    background: var(--surface-2);
    padding: 3px;
    border-radius: 9px;
    border: 1px solid var(--border);
  }

  .tab{
    appearance: none;
    border: none;
    background: transparent;
    padding: 9px 18px;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text-soft);
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: color .15s ease, background .15s ease, box-shadow .15s ease;
  }

  .tab .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    opacity: .55;
  }

  .tab.active{
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }
  .tab.active[data-type="abnormal"]{ color: var(--abnormal); }
  .tab.active[data-type="handover"]{ color: var(--handover); }
  .tab.active .dot{ opacity: 1; }
  .tab:not(.active):hover{ color: var(--text); }

  main{
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px;
  }

  .panel{ display: none; }
  .panel.active{ display: block; animation: fadein .18s ease; }
  @keyframes fadein{ from{ opacity: 0; transform: translateY(2px);} to{ opacity: 1; transform: translateY(0);} }

  .panel-summary{
    font-size: 14px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 16px;
  }
  .panel-summary strong{
    color: var(--accent, var(--text));
    font-size: 17px;
    font-weight: 800;
  }

  .panel-layout{
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 22px;
    align-items: start;
  }
  .panel-layout .card{ margin-bottom: 0; }
  .panel-table-col{ min-width: 0; }

  @media (max-width: 980px){
    .panel-layout{ grid-template-columns: 1fr; }
  }

  .panel[data-type="abnormal"]{ --accent: var(--abnormal); --accent-soft: var(--abnormal-soft); --accent-line: var(--abnormal-line); }
  .panel[data-type="handover"]{ --accent: var(--handover); --accent-soft: var(--handover-soft); --accent-line: var(--handover-line); }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 22px;
    margin-bottom: 22px;
  }

  .card h2{
    font-size: 15px;
    color: var(--text);
    margin: 0 0 18px 0;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card h2::before{
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  .form-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    align-items: end;
  }

  .field-divider{
    grid-column: 1 / -1;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--text-faint);
    padding-top: 14px;
    margin-top: 2px;
    border-top: 1px dashed var(--border-strong);
  }
  .field-divider:first-child{ border-top: none; padding-top: 0; margin-top: 0; }

  .field{ display: flex; flex-direction: column; gap: 7px; }
  .field.wide{ grid-column: 1 / -1; }

  label{
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-soft);
  }

  .field-hint{
    font-weight: 700;
    color: var(--abnormal);
    font-size: 12px;
  }

  input[type="text"], input[type="date"], select, textarea{
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 11px 13px;
    font-size: 16px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  input:focus, select:focus, textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  }

  textarea{ resize: vertical; min-height: 40px; }

  .btn{
    appearance: none;
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s ease, background .15s ease, transform .05s ease, border-color .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    vertical-align: middle;
  }
  .btn-icon{
    width: 16px;
    height: 16px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover{ opacity: .92; }
  .btn-secondary{
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
  }
  .btn-secondary:hover{ border-color: var(--accent); color: var(--accent); }
  .btn-danger{
    background: transparent;
    border: 1px solid transparent;
    color: var(--abnormal);
    margin-right: 4px;
  }
  .btn-danger:hover{ background: var(--abnormal-soft); }
  .btn-ghost{
    background: transparent;
    color: var(--text-faint);
    padding: 5px 9px;
    font-weight: 600;
    font-size: 15px;
    border-radius: 5px;
  }
  .btn-ghost:hover{ color: var(--abnormal); background: var(--abnormal-soft); }

  .table-toolbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .table-toolbar .status{
    font-size: 14px;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }

  .sync-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: #16a34a;
    display: inline-block;
  }
  .sync-dot.loading{ background: #d4d4d8; animation: pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity: .3; } }

  #ab-print-only{ display: none; }

  @media print{
    #ab-table-wrap{ display: none !important; }
    #ab-print-only{ display: block !important; }
    .panel[data-type="abnormal"] .print-title,
    .panel[data-type="abnormal"] .print-meta{ display: none !important; }

    .ab-print-page{ page-break-after: always; }
    .ab-print-page:last-child{ page-break-after: auto; }

    .ab-print-table{
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }
    .ab-print-table th, .ab-print-table td{
      border: 1px solid #000 !important;
      padding: 6px 6px;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 14pt;
    }
    .ab-print-table .ab-title-row th{ font-size: 14pt; font-weight: 400; text-align: center; }
    .ab-print-table .ab-legend-row th{ font-size: 11pt; font-weight: 400; text-align: center; }
    .ab-print-table .ab-header-row th{ font-size: 12pt; font-weight: 400; text-align: center; }

    /* 欄寬比例對照 Excel：日期/車號/客戶名稱/異常類別/狀況說明/處理方式/責任歸屬/補充說明 */
    .ab-print-table col.c1{ width: 7.5%; }
    .ab-print-table col.c2{ width: 7%; }
    .ab-print-table col.c3{ width: 13.9%; }
    .ab-print-table col.c4{ width: 7.9%; }
    .ab-print-table col.c5{ width: 37.2%; }
    .ab-print-table col.c6{ width: 10.3%; }
    .ab-print-table col.c7{ width: 10.3%; }
    .ab-print-table col.c8{ width: 5.9%; }

    .ab-print-table tbody td:nth-child(1),
    .ab-print-table tbody td:nth-child(2),
    .ab-print-table tbody td:nth-child(3),
    .ab-print-table tbody td:nth-child(4),
    .ab-print-table tbody td:nth-child(6){ text-align: center; }
    .ab-print-table tbody td:nth-child(5),
    .ab-print-table tbody td:nth-child(7),
    .ab-print-table tbody td:nth-child(8){ text-align: left; }
  }

  #ho-print-only{ display: none; }

  #ho-print-table{
    border-collapse: collapse;
  }
  #ho-print-table th, #ho-print-table td{
    border: 1px solid #000;
    padding: 6px 8px;
  }
  #ho-print-title-cell{
    font-weight: 700;
    text-align: center;
  }

  @media print{
    #ho-table-wrap{ display: none !important; }
    #ho-print-only{ display: block !important; }
    .panel[data-type="handover"] .print-title,
    .panel[data-type="handover"] .print-meta{ display: none !important; }
    #ho-print-table{
      width: 100%;
      table-layout: fixed;
      font-family: "Microsoft JhengHei", "微軟正黑體", "PMingLiU", sans-serif;
    }
    #ho-print-table th, #ho-print-table td{
      border: 1px solid #000 !important;
      font-size: 12pt;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    #ho-print-title-cell{
      font-size: 14pt;
      font-weight: 700;
      text-align: center;
      height: 30px;
    }
    #ho-print-table thead tr:nth-child(2) th:nth-child(1){ width: 15%; }
    #ho-print-table thead tr:nth-child(2) th:nth-child(2){ width: 85%; }
    #ho-print-table td:first-child{ width: 15%; text-align: center; }
  }

  .table-wrap{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: auto;
    max-height: 62vh;
    box-shadow: var(--shadow-sm);
  }

  table{
    width: 100%;
    border-collapse: collapse;
    font-size: 15.5px;
  }

  th, td{
    padding: 13px 16px;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
  }

  th{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    color: var(--text-faint);
    white-space: nowrap;
    background: var(--surface);
    border-bottom: 1px solid var(--border-strong);
    position: sticky;
    top: 0;
    z-index: 1;
  }

  tbody tr{ transition: background .1s ease; }
  tbody tr:hover{ background: var(--surface-2); }
  tbody tr:last-child td{ border-bottom: none; }

  td.mono-cell{ font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14.5px; color: var(--text-soft); white-space: nowrap; }

  .chip{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px 4px 9px;
    border-radius: 100px;
    font-size: 13.5px;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .chip::before{ content:""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .chip.return{ background: #FFE4E4; color: #E93E38; border-color: rgba(233, 62, 56, 0.35); }
  .chip.exchange{ background: #E5EFFE; color: #2D79E4; border-color: rgba(45, 121, 228, 0.35); }
  .chip.reaction{ background: #FDF2D8; color: #FFA836; border-color: rgba(255, 168, 54, 0.4); }
  .chip.restock{ background: #DAF7E5; color: #01AB56; border-color: rgba(1, 171, 86, 0.35); }

  .empty-row td{
    text-align: center;
    color: var(--text-faint);
    padding: 40px;
    border-bottom: none;
    font-size: 14px;
  }
  .empty-row .empty-icon{ display: block; font-size: 22px; margin-bottom: 6px; opacity: .6; }

  .col-del{ width: 68px; text-align: right; white-space: nowrap; }

  .inline-edit-row td{ padding: 0; border-bottom: 1px solid var(--border); }
  .inline-edit-form{
    background: var(--surface-2);
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    align-items: end;
    border-top: 2px solid var(--accent, var(--handover));
    border-bottom: 1px solid var(--border-strong);
  }
  .inline-edit-form .field.wide{ grid-column: 1 / -1; }
  .inline-edit-form label{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-soft);
    display: block;
    margin-bottom: 6px;
  }
  .inline-edit-form input, .inline-edit-form select, .inline-edit-form textarea{
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    box-sizing: border-box;
  }
  .inline-edit-form textarea{ resize: vertical; min-height: 40px; }

  .toast{
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: #fff;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 100;
    box-shadow: var(--shadow-md);
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .preview-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 20, 0.55);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .preview-overlay.show{ display: flex; }

  .preview-modal{
    background: #fff;
    width: 100%;
    max-width: 1240px;
    max-height: 90vh;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-md);
  }

  .preview-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .preview-header h3{ margin: 0; font-size: 16px; font-weight: 700; }
  .preview-actions{ display: flex; gap: 8px; }

  .preview-hint{
    font-size: 12.5px;
    color: var(--text-faint);
    padding: 10px 22px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .preview-toolbar{
    display: flex;
    gap: 20px;
    align-items: center;
    padding: 10px 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  .preview-toolbar label{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
  }
  .preview-toolbar select{
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 13.5px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }

  .preview-body{
    overflow: auto;
    padding: 24px;
    background: #EFEFF2;
    flex: 1;
  }

  .preview-page{
    background: #fff;
    margin: 0 auto 24px auto;
    padding: 14px;
    box-shadow: var(--shadow-sm);
    max-width: 1100px;
  }
  .preview-page:last-child{ margin-bottom: 0; }

  .preview-table{
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
  }
  .preview-table th, .preview-table td{
    border: 1px solid #ccc;
    padding: 7px 9px;
    font-size: 13.5px;
    text-align: left;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  .preview-table .ab-title-row th{ font-weight: 700; text-align: center; background: #FAFAF8; }
  .preview-table .ab-legend-row th{ font-size: 12px; text-align: center; color: #666; background: #FAFAF8; }
  .preview-table .ab-header-row th{ font-weight: 700; text-align: center; background: #F1F1F3; }
  .preview-table thead th{ font-weight: 700; background: #F1F1F3; text-align: center; }

  .preview-table [contenteditable="true"]{
    outline: none;
    cursor: text;
    transition: background .1s ease;
  }
  .preview-table [contenteditable="true"]:hover{ background: #FFF9E0; }
  .preview-table [contenteditable="true"]:focus{ background: #FFF3C0; }

  .preview-table th, .preview-table td{ position: relative; }

  .col-resize-handle{
    position: absolute;
    top: 0; right: -3px;
    width: 6px; height: 100%;
    cursor: col-resize;
    z-index: 5;
  }
  .col-resize-handle:hover, .col-resize-handle:active{ background: rgba(45, 121, 228, 0.35); }

  .row-resize-handle{
    position: absolute;
    left: 0; bottom: -3px;
    width: 100%; height: 6px;
    cursor: row-resize;
    z-index: 5;
  }
  .row-resize-handle:hover, .row-resize-handle:active{ background: rgba(45, 121, 228, 0.35); }

  @media print{
    .col-resize-handle, .row-resize-handle{ display: none !important; }
  }

  /* ---------- Print ---------- */
  @media print{
    @page{ size: A4 landscape; margin: 18mm 10mm; }
    html, body{ width: 277mm; margin: 0; padding: 0; }
    header, .card, .table-toolbar, .btn, .col-del{ display: none !important; }
    body{ background: #fff; }
    main{ max-width: 277mm; width: 277mm; padding: 0; margin: 0; }
    .table-wrap{ border: none; box-shadow: none; border-radius: 0; overflow: visible; max-height: none; width: 277mm; }
    thead th{ position: static; }
    .print-title{ display: block !important; }
    table{
      font-size: 10px;
      width: 277mm;
      max-width: 277mm;
      table-layout: fixed;
    }
    th, td{
      border: 1px solid #000 !important;
      padding: 4px 5px;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal !important;
      max-width: 0; /* forces fixed-layout columns to respect table width instead of expanding to content */
    }
    th{ background: none !important; }
    .chip{ background: transparent !important; color: #000 !important; border: none !important; padding: 0; font-weight: 700; }
    .chip::before{ display: none; }
  }

  /* 只有在「列印預覽」視窗開啟時列印，才印出視窗內容，其餘畫面全部隱藏 */
  @media print{
    body.previewing > *:not(#print-preview-overlay){ display: none !important; }
    body.previewing #print-preview-overlay{
      display: block !important;
      position: static !important;
      inset: auto !important;
      background: none !important;
      padding: 0 !important;
    }
    body.previewing .preview-modal{
      box-shadow: none !important;
      max-width: none !important;
      max-height: none !important;
      width: auto !important;
      height: auto !important;
      border-radius: 0 !important;
      display: block !important;
    }
    body.previewing .preview-header,
    body.previewing .preview-hint,
    body.previewing .preview-toolbar{ display: none !important; }
    body.previewing .preview-body{
      overflow: visible !important;
      padding: 0 !important;
      background: #fff !important;
    }
    body.previewing .preview-page{
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      max-width: none !important;
    }
  }

  .print-title{
    display: none;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 4px 0;
  }
  .print-meta{
    display: none;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 14px;
  }
  @media print{
    .print-meta{ display: block; }
  }

  @media (max-width: 640px){
    header{ padding: 14px 16px; }
    main{ padding: 16px; }
    .form-grid{ grid-template-columns: 1fr 1fr; }
  }
  /* ===== 新版外觀：清爽卡片式後台（只作用於螢幕；列印與匯出格式完全沿用原版） ===== */
  @media screen{
    :root{
      --bg: var(--zx-canvas);
      --surface: var(--zx-surface);
      --surface-2: var(--zx-surface-2);
      --border: var(--zx-border);
      --border-strong: var(--zx-border-strong);
      --text: var(--zx-text);
      --text-soft: var(--zx-text-2);
      --text-faint: var(--zx-text-3);
      --radius: var(--radius-card);
      --shadow-sm: var(--zx-shadow);
      --shadow-md: var(--zx-shadow-hover);
    }
    body{ font-family: var(--font-body); letter-spacing: 0; font-size: 15px; }
    .mono, td.mono-cell{ font-family: var(--font-mono); }

    /* 頁首：與畫布同色、細下邊框（標題左、狀態與帳號右，對照參考版型） */
    header{ background: rgba(243, 246, 244, .92); border-bottom: 1px solid var(--zx-border); box-shadow: none; }
    .brand .mark{ width: 44px; height: 44px; border: 1px solid var(--zx-border); border-radius: 12px; background: var(--zx-surface); }
    .brand h1{ font-size: 20px; font-weight: 700; }
    .brand .sub{ color: var(--zx-text-2); font-weight: 500; }
    .header-right{ display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    /* 分頁：白底分段控制 */
    .tabs{ background: var(--zx-surface); border: 1px solid var(--zx-border); border-radius: 12px; padding: 4px; box-shadow: var(--zx-shadow); }
    .tab{ border-radius: 9px; padding: 8px 18px; color: var(--zx-text-2); }
    .tab.active{ background: var(--zx-primary-soft); box-shadow: none; }

    .card{ border: 1px solid var(--zx-border); border-radius: var(--radius-card); box-shadow: var(--zx-shadow); padding: 22px; }
    .card h2{ font-size: 16px; font-weight: 700; }

    input[type="text"], input[type="date"], select, textarea{
      border: 1px solid var(--zx-border); border-radius: var(--radius-input); background: var(--zx-surface); box-shadow: none;
    }
    input:focus, select:focus, textarea:focus{ border-color: var(--zx-primary); box-shadow: 0 0 0 3px var(--zx-primary-soft); }
    .btn:focus-visible, .tab:focus-visible{ outline: none; box-shadow: var(--focus-ring); }

    .btn{ border-radius: var(--radius-btn); transition: background var(--dur), border-color var(--dur), box-shadow var(--dur), opacity .15s; }
    .btn:disabled{ opacity: .5; cursor: not-allowed; }
    .btn-secondary{ border: 1px solid var(--zx-border); background: var(--zx-surface); box-shadow: var(--zx-shadow); }
    .btn-secondary:hover:not(:disabled){ border-color: var(--zx-border-strong); background: var(--zx-surface-2); color: var(--zx-text); }
    .btn-danger{ background: var(--zx-surface); border: 1px solid var(--zx-border); }
    .btn-ghost{ box-shadow: none; color: var(--zx-text-2); }

    /* 資料表格：可讀優先 */
    .table-wrap{ border: 1px solid var(--zx-border); border-radius: 14px; box-shadow: var(--zx-shadow); }
    th{ background: var(--zx-surface-2); color: var(--zx-text-2); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; }
    td{ color: var(--zx-text); }
    tbody tr.is-pending{ opacity: .6; }
    .pending-label{ font-size: 12px; color: var(--zx-text-2); }

    .inline-edit-form{ border-radius: 0 0 14px 14px; }
    .inline-edit-form input, .inline-edit-form select, .inline-edit-form textarea{ border: 1px solid var(--zx-border); border-radius: 10px; background: var(--zx-surface); box-shadow: none; }
    .conflict-banner{ background: #FEF3C7; color: #78350F; border-radius: 12px; padding: 10px 14px; font-weight: 600;
                      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toast{ border-radius: 12px; background: var(--zx-text); box-shadow: var(--zx-shadow-pop); }
    .preview-modal{ border-radius: var(--radius-card); }

    /* 日期範圍：分段控制（對照參考圖的 1Y／6M／1M） */
    .range-bar{ display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 14px; }
    .range-bar .range-label{ font-weight: 600; color: var(--zx-text-2); margin-right: 4px; }
    .range-chip{ border: 1px solid var(--zx-border); border-radius: 999px; padding: 6px 14px; font: 600 13.5px var(--font-body); cursor: pointer;
                 background: var(--zx-surface); color: var(--zx-text); }
    .range-chip:hover{ border-color: var(--zx-border-strong); }
    .panel[data-type="abnormal"]{ --accent-strong: #C2261F; }
    .panel[data-type="handover"]{ --accent-strong: #1F5FBF; }
    .range-chip.active{ background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
    .btn-primary{ background: var(--accent-strong, var(--accent)); }
    .range-custom{ display: inline-flex; gap: 6px; align-items: center; }
    .range-custom[hidden]{ display: none; }
    .range-custom input{ padding: 6px 10px; font-size: 14px; }
    .load-more{ margin: 14px auto 0; display: flex; }
    .load-more[hidden]{ display: none; }
    .car-source{ font-size: 12px; color: var(--zx-primary-ink); font-weight: 600; min-height: 16px; }
    .role-note{ background: var(--zx-surface-2); border: 1px solid var(--zx-border); border-radius: 12px; padding: 10px 14px; color: var(--zx-text-2); font-weight: 600; }
    .panel-summary .range-now{ color: var(--zx-text-2); font-weight: 500; margin-left: 6px; }
    #zx-sync-badge{ white-space: nowrap; }

    .chip{ white-space: nowrap; }
    .panel-layout > *, .form-grid > *{ min-width: 0; }
    input, select, textarea{ max-width: 100%; }

    @media (max-width: 640px){
      .header-right{ width: 100%; justify-content: space-between; }
      .range-bar{ gap: 6px; }
      .card{ padding: 16px; }
      .form-grid{ grid-template-columns: 1fr; }
      .table-toolbar > div{ display: flex; flex-wrap: wrap; gap: 6px; }
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"><img src="../shared/logo.svg" alt="忠欣蔬果 LOGO"></span>
    <div>
      <h1>異常表與交接表</h1>
      <div class="sub">多裝置即時同步</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-type="abnormal" onclick="switchTab('abnormal')">
      <span class="dot"></span>異常表
    </button>
    <button class="tab" data-type="handover" onclick="switchTab('handover')">
      <span class="dot"></span>交接表
    </button>
  </div>
  <div class="header-right">
    <span id="zx-sync-badge" class="sync-badge" data-state="pending" role="status" aria-live="polite">連線中…</span>
    <span id="zx-user-chip"></span>
  </div>
</header>

<main>

  <!-- ============ 異常表 ============ -->
  <section class="panel active" data-type="abnormal">
    <div class="panel-summary">目前共 <strong id="ab-count">0</strong> 筆異常紀錄<span class="range-now">（<span id="ab-range-label"></span>）</span></div>
    <div class="range-bar" id="ab-range" role="group" aria-label="日期範圍"><span class="range-label">日期範圍</span><button type="button" class="range-chip" data-preset="today">今天</button><button type="button" class="range-chip" data-preset="7d">近 7 天</button><button type="button" class="range-chip" data-preset="30d">近 30 天</button><button type="button" class="range-chip" data-preset="all">全部</button><button type="button" class="range-chip" data-preset="custom">自訂</button><span class="range-custom" hidden><input type="date" data-range-from aria-label="開始日期">～<input type="date" data-range-to aria-label="結束日期"><button type="button" class="btn btn-secondary" data-range-apply>套用</button></span></div>
    <div class="panel-layout">
    <div class="card">
      <h2>新增異常紀錄</h2>
      <form id="form-abnormal" class="form-grid" onsubmit="return false;">
        <div class="field-divider">基本資訊</div>
        <div class="field">
          <label>日期</label>
          <input type="date" id="ab-date" required>
        </div>
        <div class="field">
          <label>車號</label>
          <input type="text" id="ab-carNo" placeholder="例：ABC-1234">
        </div>
        <div class="field">
          <label>店家</label>
          <input type="text" id="ab-store" list="ab-store-datalist" placeholder="店家名稱" required oninput="handleStoreAutoFill()">
          <datalist id="ab-store-datalist"></datalist>
          <div id="ab-car-source" class="car-source" aria-live="polite"></div>
        </div>

        <div class="field-divider">異常內容</div>
        <div class="field wide">
          <label>狀況說明 <span class="field-hint">*格式：日期 品項 數量 原因</span></label>
          <textarea id="ab-reason" placeholder="請描述異常狀況"></textarea>
        </div>
        <div class="field">
          <label>處理方式</label>
          <select id="ab-exchangeType">
            <option value="退貨">退貨</option>
            <option value="換貨">換貨</option>
            <option value="反應">反應</option>
            <option value="補貨">補貨</option>
          </select>
        </div>
        <div class="field">
          <label>異常類別</label>
          <select id="ab-category">
            <option value="A 品質">A 品質</option>
            <option value="B 送貨延遲(送錯貨)">B 送貨延遲(送錯貨)</option>
            <option value="C 銷貨單 手抄單錯誤">C 銷貨單 手抄單錯誤</option>
            <option value="D 漏單">D 漏單</option>
            <option value="E 未依客戶需求供貨">E 未依客戶需求供貨</option>
            <option value="F 銷貨單未送達(未簽名)">F 銷貨單未送達(未簽名)</option>
            <option value="G 交接事項">G 交接事項</option>
            <option value="H 收回退貨">H 收回退貨</option>
            <option value="I 出貨數量異常">I 出貨數量異常</option>
          </select>
        </div>
        <div class="field">
          <label>責任歸屬 <span class="field-hint">*司機填寫</span></label>
          <input type="text" id="ab-responsibility" placeholder="例：業務／倉儲／客戶／廠商">
        </div>
        <div class="field wide">
          <label>補充說明 <span class="field-hint">*司機填寫</span></label>
          <textarea id="ab-note" placeholder="其他補充說明（選填）"></textarea>

<script>
/* 核心 UI 函式：不依賴任何外部函式庫，確保即使雲端連線失敗，
   頁籤切換、提示訊息等基本畫面互動仍然正常運作 */

function switchTab(type){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.type === type));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function closeInlineEdits(){
  document.querySelectorAll('.inline-edit-row').forEach(el => el.remove());
}

function setSyncState(type, state){
  // state: 'loading' | 'synced' | 'error'
  const dot = document.getElementById(type === 'abnormal' ? 'ab-sync-dot' : 'ho-sync-dot');
  const text = document.getElementById(type === 'abnormal' ? 'ab-sync-text' : 'ho-sync-text');
  dot.classList.toggle('loading', state === 'loading');
  dot.style.background = state === 'error' ? '#ef4444' : (state === 'loading' ? '' : '#22c55e');
  text.textContent = state === 'error' ? '同步失敗' : (state === 'loading' ? '同步中…' : '已同步');
}
</script>

function chipClass(status){
  switch (status){
    case '換貨': return 'exchange';
    case '反應': return 'reaction';
    case '補貨': return 'restock';
    default: return 'return'; // 退貨
  }
}

function escapeHtml(v){
  if (v === undefined || v === null) return '';
  return String(v)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}

function chunkArray(arr, size){
  const chunks = [];
  for (let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));
  return chunks;
}

function formatDateMD(dateStr){
  if (!dateStr) return '';
  const m = String(dateStr).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${parseInt(m[2], 10)}月${parseInt(m[3], 10)}日`;
  const d = new Date(dateStr);
  if (!isNaN(d.getTime())) return `${d.getMonth() + 1}月${d.getDate()}日`;
  return dateStr;
}

/* ---------------- 列印預覽：欄寬 / 列高可拖曳調整 ---------------- */

function makeColumnsResizable(table){
  const cols = table.querySelectorAll('colgroup col');
  const headerRow = table.querySelector('thead tr:last-child');
  if (!cols.length || !headerRow) return;
  const ths = headerRow.querySelectorAll('th');

  ths.forEach((th, i) => {
    if (i >= cols.length) return;
    th.classList.add('resizable-th');
    const handle = document.createElement('span');
    handle.className = 'col-resize-handle';
    th.appendChild(handle);
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const startX = e.clientX;
      const tableWidth = table.getBoundingClientRect().width || 800;
      const startPct = parseFloat(cols[i].style.width) || (100 / cols.length);
      function onMove(ev){
        const deltaPct = ((ev.clientX - startX) / tableWidth) * 100;
        const newPct = Math.max(3, startPct + deltaPct);
        cols[i].style.width = newPct.toFixed(2) + '%';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function makeRowsResizable(table){
  table.querySelectorAll('tbody tr').forEach(tr => {
    const lastCell = tr.lastElementChild;
    if (!lastCell) return;
    lastCell.classList.add('resizable-td');
    const handle = document.createElement('span');
    handle.className = 'row-resize-handle';
    lastCell.appendChild(handle);
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const startY = e.clientY;
      const startHeight = tr.getBoundingClientRect().height;
      function onMove(ev){
        const newHeight = Math.max(20, startHeight + (ev.clientY - startY));
        tr.style.height = newHeight + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function setPageOrientation(orientation){

  if (!styleTag){
    styleTag = document.createElement('style');
    styleTag.id = 'dynamic-page-style';

  styleTag.textContent = orientation === 'portrait'

/* ---------------- 匯出 Excel（含選擇儲存位置） ---------------- */

function loadExcelJS(){
  return new Promise((resolve, reject) => {
    if (window.ExcelJS){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('無法載入 Excel 匯出功能，請檢查網路連線'));
    document.head.appendChild(script);
  });
}

const THIN_BORDER = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };

async function downloadWorkbook(workbook, filename){
  const buffer = await workbook.xlsx.writeBuffer();

  // 支援的瀏覽器（Chrome / Edge）會跳出「另存新檔」視窗，讓使用者自己選擇要存到哪裡
  if (window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{
          description: 'Excel 檔案',
          accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(buffer);
      await writable.close();
      return true;
    }catch(err){
      if (err.name === 'AbortError') return false; // 使用者取消了另存新檔
      console.warn('showSaveFilePicker 失敗，改用瀏覽器預設下載', err);
    }
  }

  // 不支援選擇位置的瀏覽器（例如 Firefox、Safari），退回一般下載到預設下載資料夾
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

<script>
/* =========================================================
   異常表與交接表｜資料層與同步（新版）
   - 不再每 8 秒拉全表：首載只取目前日期範圍、每頁 50 筆（keyset），之後靠 Broadcast 小事件局部更新
   - 寫入：新增帶 request_id（斷線重送不重複）、修改帶 revision（陳舊畫面不會悄悄覆蓋）
   - 刪除／刪除全部：只限管理員（伺服器 RLS／RPC 驗證）
   列印預覽與匯出 Excel 沿用原版程式碼（見下方「原版保留」區塊），僅在執行前先把目前範圍資料載入完整
   ========================================================= */

const TABLES = { abnormal: 'abnormal_reports', handover: 'handover_reports' };
const COLS = {
  abnormal: 'id,date,report_date,car_no,store,reason,exchange_type,category,responsibility,note,created_at,revision,customer_code,car_no_source',
  handover: 'id,date,report_date,store,content,created_at,revision,customer_code'
};
const PAGE_SIZE = 50;
const RANGE_STORE_KEY = 'zx-report-range';

let sb = null;
let ZXC = null;            // 登入後的 ctx：{ user, member, can }
let syncer = null;
let abnormalRows = [];
let handoverRows = [];
const view = {
  abnormal: { preset: 'today', from: null, to: null, cursor: null, hasMore: false, loading: false },
  handover: { preset: 'today', from: null, to: null, cursor: null, hasMore: false, loading: false }
};
const editing = { abnormal: null, handover: null };   // 正在行內編輯的 id → 收到遠端更新時保留草稿並提示

function rowsOf(type){ return type === 'abnormal' ? abnormalRows : handoverRows; }
function setRows(type, rows){ if (type === 'abnormal') abnormalRows = rows; else handoverRows = rows; }

/* ---------------- 資料轉換（維持原版中文欄位鍵，另外附帶內部欄位） ---------------- */

function dbRowToAppRow(type, row){
  const base = type === 'abnormal' ? {
    'id': row.id,
    '日期': row.date || (row.report_date || ''),
    '車號': row.car_no || '',
    '店家': row.store || '',
    '狀況說明': row.reason || '',
    '處理方式': row.exchange_type || '',
    '異常類別': row.category || '',
    '責任歸屬': row.responsibility || '',
    '補充說明': row.note || '',
    '建立時間': row.created_at ? new Date(row.created_at).toLocaleString('zh-TW') : ''
  } : {
    'id': row.id,
    '日期': row.date || (row.report_date || ''),
    '客戶名稱+車號': row.store || '',
    '事項': row.content || ''
  };
  base._rev = row.revision;
  base._date = row.report_date;
  base._created = row.created_at;
  base._code = row.customer_code || null;
  return base;
}

function appDataToDbRow(type, data){
  if (type === 'abnormal'){
    return {
      date: data.date || '',
      report_date: /^\d{4}-\d{2}-\d{2}$/.test(data.date || '') ? data.date : null,
      car_no: data.carNo || '',
      store: data.store || '',
      reason: data.reason || '',
      issue_description: data.reason || '',
      exchange_type: data.exchangeType || '',
      category: data.category || '',
      responsibility: data.responsibility || '',
      note: data.note || '',
      customer_code: data.customerCode || null,
      car_no_source: data.carNoSource || null
    };
  }
  return {
    date: data.date || '',
    report_date: /^\d{4}-\d{2}-\d{2}$/.test(data.date || '') ? data.date : null,
    store: data.store || '',
    content: data.content || '',
    handover_description: data.content || ''
  };
}

/* ---------------- 日期範圍 ---------------- */

function localISO(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function presetRange(preset){
  const today = new Date();
  const back = n => { const d = new Date(); d.setDate(d.getDate() - n); return localISO(d); };
  if (preset === 'today') return { from: localISO(today), to: localISO(today) };
  if (preset === '7d') return { from: back(6), to: localISO(today) };
  if (preset === '30d') return { from: back(29), to: localISO(today) };
  if (preset === 'all') return { from: null, to: null };
  return null;
}
const PRESET_LABEL = { today: '今天', '7d': '近 7 天', '30d': '近 30 天', all: '全部', custom: '自訂' };

function applyRange(type, preset, from, to){
  const v = view[type];
  v.preset = preset;
  const r = preset === 'custom' ? { from: from || null, to: to || null } : presetRange(preset);
  v.from = r.from; v.to = r.to;
  try { localStorage.setItem(RANGE_STORE_KEY + '-' + type, JSON.stringify({ preset, from: v.from, to: v.to })); } catch (e) {}
  renderRangeBar(type);
  return reload(type);
}

function inRange(type, d){
  const v = view[type];
  if (!v.from && !v.to) return true;
  if (!d) return false;
  return (!v.from || d >= v.from) && (!v.to || d <= v.to);
}

function rangeText(type){
  const v = view[type];
  if (!v.from && !v.to) return '全部日期';
  if (v.from === v.to) return v.from;
  return (v.from || '…') + ' ～ ' + (v.to || '…');
}

function renderRangeBar(type){
  const bar = document.getElementById(type === 'abnormal' ? 'ab-range' : 'ho-range');
  if (!bar) return;
  const v = view[type];
  bar.querySelectorAll('[data-preset]').forEach(b => {
    const on = b.dataset.preset === v.preset;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  bar.querySelector('.range-custom').hidden = v.preset !== 'custom';
  bar.querySelector('[data-range-from]').value = v.from || '';
  bar.querySelector('[data-range-to]').value = v.to || '';
}

/* ---------------- 讀取（欄位投影 + 日期範圍 + keyset 分頁） ---------------- */

async function fetchPage(type, reset){
  const v = view[type];
  if (v.loading) return;
  v.loading = true;
  setSyncState(type, 'loading');
  try{
    let q = sb.from(TABLES[type]).select(COLS[type])
      .order('created_at', { ascending: false }).order('id', { ascending: false })
      .limit(PAGE_SIZE + 1);
    if (v.from) q = q.gte('report_date', v.from);
    if (v.to) q = q.lte('report_date', v.to);
    if (!reset && v.cursor){
      const c = v.cursor;
      q = q.or(`created_at.lt."${c.created_at}",and(created_at.eq."${c.created_at}",id.lt.${c.id})`);
    }
    const { data, error } = await q;
    if (error) throw new Error(error.message);
    v.hasMore = data.length > PAGE_SIZE;
    const page = data.slice(0, PAGE_SIZE);
    if (page.length) v.cursor = { created_at: page[page.length - 1].created_at, id: page[page.length - 1].id };
    else if (reset) v.cursor = null;
    const mapped = page.map(r => dbRowToAppRow(type, r));
    setRows(type, reset ? mapped : rowsOf(type).concat(mapped.filter(m => !rowsOf(type).some(r => r.id === m.id))));
    renderType(type);
    setSyncState(type, 'synced');
  }catch(err){
    setSyncState(type, 'error');
    showToast('讀取失敗：' + err.message);
  }finally{
    v.loading = false;
  }
}

function reload(type){ view[type].cursor = null; return fetchPage(type, true); }
async function loadMore(type){ await fetchPage(type, false); }
async function ensureAllLoaded(type){
  let guard = 0;
  while (view[type].hasMore && guard++ < 40) await fetchPage(type, false);
}

// 收到推播後只讀被改動的那幾列；150ms 內的多個事件合併成一次查詢
const pendingFetch = { abnormal: new Set(), handover: new Set() };
let fetchTimer = null;
function queueFetch(type, id){
  pendingFetch[type].add(id);
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(flushFetch, 150);
}
async function flushFetch(){
  for (const type of ['abnormal', 'handover']){
    const ids = Array.from(pendingFetch[type]);
    pendingFetch[type].clear();
    if (!ids.length) continue;
    const { data, error } = await sb.from(TABLES[type]).select(COLS[type]).in('id', ids);
    if (error){ console.warn('fetch rows failed', error); continue; }
    const got = new Set();
    data.forEach(r => { got.add(r.id); upsertLocal(type, dbRowToAppRow(type, r)); });
    ids.filter(id => !got.has(id)).forEach(id => removeLocal(type, id));
    renderType(type);
  }
}

function sortRows(rows){
  return rows.sort((a, b) => (b._created || '').localeCompare(a._created || '') || String(b.id).localeCompare(String(a.id)));
}

function upsertLocal(type, row){
  const rows = rowsOf(type);
  if (!inRange(type, row._date)){ removeLocal(type, row.id); return; }
  const i = rows.findIndex(r => r.id === row.id);
  if (editing[type] === row.id && i > -1 && rows[i]._rev !== row._rev){
    rows[i]._remote = row;                // 保留使用者草稿，只標示「資料已在別處更新」
    markEditConflict(type, row.id);
    return;
  }
  if (i > -1) rows[i] = row; else rows.push(row);
  sortRows(rows);
}

function removeLocal(type, id){
  setRows(type, rowsOf(type).filter(r => r.id !== id));
  if (editing[type] === id){ closeInlineEdits(); showToast('這筆資料已在其他裝置刪除'); }
}

/* ---------------- 即時同步（Broadcast 小事件 + change_log 游標補差） ---------------- */

function onRemoteChange(c){
  const type = c.t === 'abnormal_reports' ? 'abnormal' : c.t === 'handover_reports' ? 'handover' : null;
  if (!type) return;
  if (c.k === '*'){ reload(type); return; }
  if (c.op === 'D'){ removeLocal(type, c.k); renderType(type); return; }
  const existing = rowsOf(type).find(r => r.id === c.k);
  if (existing && c.rev != null && existing._rev >= c.rev) return;      // 本機已是最新（例如自己剛寫入）
  const d = c.v && c.v.report_date;
  if (!inRange(type, d)){
    if (existing){ removeLocal(type, c.k); renderType(type); }
    return;
  }
  queueFetch(type, c.k);
}

let customerNames = [];        // [{ code, name }]，來自 customers + customer_aliases
async function loadCustomerNames(){
  try{
    const all = [];
    for (let from = 0; ; from += 1000){
      const { data, error } = await sb.from('customers').select('code,name').eq('is_active', true).order('code').range(from, from + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    const { data: aliases } = await sb.from('customer_aliases').select('customer_code,alias_name').limit(5000);
    (aliases || []).forEach(a => all.push({ code: a.customer_code, name: a.alias_name }));
    customerNames = all.filter(x => x.name);
    refreshStoreDatalist();
  }catch(err){ console.warn('載入客戶主檔失敗，改用內建名單', err); }
}

function refreshStoreDatalist(){
  const datalist = document.getElementById('ab-store-datalist');
  if (!datalist) return;
  const historical = (abnormalRows || []).map(r => (r['店家'] || '').trim()).filter(Boolean);
  const names = Array.from(new Set([...customerNames.map(c => c.name), ...STATIC_CUSTOMER_NAMES, ...historical]))
    .sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  datalist.innerHTML = names.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
}

function matchCustomerCodes(name){
  const n = (name || '').trim();
  return Array.from(new Set(customerNames.filter(c => c.name === n).map(c => c.code)));
}

let autoFillTimer = null;
let carSource = null;
function handleStoreAutoFill(){
  clearTimeout(autoFillTimer);
  autoFillTimer = setTimeout(doStoreAutoFill, 250);
}
async function doStoreAutoFill(){
  const storeVal = document.getElementById('ab-store').value.trim();
  const carInput = document.getElementById('ab-carNo');
  const label = document.getElementById('ab-car-source');
  label.textContent = '';
  carSource = null;
  if (!storeVal) return;
  // 1) 主檔／別名對到「唯一」客戶 → 讀有效的車輛指派
  const codes = matchCustomerCodes(storeVal);
  if (codes.length > 1) label.textContent = `⚠ 有 ${codes.length} 位客戶同名，請確認`;
  if (codes.length === 1){
    const { data } = await sb.rpc('current_vehicle', { p_customer_code: codes[0] });
    if (data && data.length && data[0].car_no){
      carInput.value = data[0].car_no;
      carSource = 'assignment';
      label.textContent = '車號來源：客戶車輛設定，請確認';
      return;
    }
  }
  // 2) 沒有指派 → 參考該店家最近一筆歷史紀錄（不限目前日期範圍）
  const local = (abnormalRows || []).find(r => (r['店家'] || '').trim().toLowerCase() === storeVal.toLowerCase() && r['車號']);
  let car = local ? local['車號'] : null, when = local ? local['日期'] : null;
  if (!car){
    const { data } = await sb.from('abnormal_reports').select('car_no,date').eq('store', storeVal).neq('car_no', '')
      .order('created_at', { ascending: false }).limit(1);
    if (data && data.length){ car = data[0].car_no; when = data[0].date; }
  }
  if (car){
    carInput.value = car;
    carSource = 'history';
    label.textContent = `車號來源：最近一筆紀錄（${when || '日期不明'}），請確認`;
  }
}

/* ---------------- 寫入（樂觀更新 → 成功才標示已同步；失敗復原並可重試） ---------------- */

function isTransient(err){
  return !err || !err.code || err.message === 'Failed to fetch' || /^(08|57P|PGRST00)/.test(err.code);
}
async function withRetry(fn, retries = 3){
  for (let i = 0; ; i++){
    const r = await fn();
    if (!r.error || !isTransient(r.error) || i >= retries) return r;
    await new Promise(res => setTimeout(res, 800 * Math.pow(2, i) + Math.random() * 400));
  }
}

async function insertRow(type, data){
  const requestId = zxSync.uuid();
  const payload = Object.assign(appDataToDbRow(type, data), { request_id: requestId });
  let r = await withRetry(() => sb.from(TABLES[type]).insert(payload).select(COLS[type]).single());
  if (r.error && r.error.code === '23505'){
    // 斷線重送：第一次其實已寫入 → 用 request_id 取回那一筆
    r = await sb.from(TABLES[type]).select(COLS[type]).eq('request_id', requestId).single();
  }
  if (r.error) throw new Error(r.error.message);
  return dbRowToAppRow(type, r.data);
}

async function updateRow(type, id, data, expectedRev){
  let q = sb.from(TABLES[type]).update(appDataToDbRow(type, data)).eq('id', id);
  if (expectedRev != null) q = q.eq('revision', expectedRev);
  const r = await withRetry(() => q.select(COLS[type]));
  if (r.error) throw new Error(r.error.message);
  if (!r.data.length) return null;               // revision 不符（別處已更新）或沒有權限
  return dbRowToAppRow(type, r.data[0]);
}

async function deleteRow(type, id){
  const r = await withRetry(() => sb.from(TABLES[type]).delete({ count: 'exact' }).eq('id', id));
  if (r.error) throw new Error(r.error.message);
  if (!r.count) throw new Error('沒有刪除權限（只限管理員），或資料已不存在');
}

function optimisticAdd(type, data){
  const temp = dbRowToAppRow(type, Object.assign(appDataToDbRow(type, data), {
    id: 'tmp-' + zxSync.uuid(), created_at: new Date().toISOString(), revision: 0
  }));
  temp._pending = true;
  if (inRange(type, temp._date)){ rowsOf(type).unshift(temp); renderType(type); }
  return temp.id;
}
function settleAdd(type, tempId, row){
  setRows(type, rowsOf(type).filter(r => r.id !== tempId));
  if (row) upsertLocal(type, row);
  renderType(type);
}

}

function markEditConflict(type, id){
  const form = document.querySelector('.inline-edit-row .inline-edit-form');
  if (!form || form.querySelector('.edit-conflict')) return;
  const box = document.createElement('div');
  box.className = 'field wide edit-conflict';
  box.setAttribute('role', 'alert');
  box.innerHTML = `<div class="conflict-banner">⚠ 資料已在別處更新。你的草稿仍保留在下方，可選擇：
      <button type="button" class="btn btn-secondary" data-conflict="reload">載入最新內容（捨棄草稿）</button>
      <button type="button" class="btn btn-secondary" data-conflict="overwrite">以我的草稿覆蓋</button></div>`;
  form.prepend(box);
  box.querySelector('[data-conflict="reload"]').onclick = () => {
    const row = rowsOf(type).find(r => r.id === id);
    if (row && row._remote){ Object.assign(row, row._remote); delete row._remote; }
    editing[type] = null;
    renderType(type);
    (type === 'abnormal' ? editAbnormal : editHandover)(id);
  };
  box.querySelector('[data-conflict="overwrite"]').onclick = () => {
    const row = rowsOf(type).find(r => r.id === id);
    if (row && row._remote){ row._rev = row._remote._rev; delete row._remote; }
    box.remove();
    (type === 'abnormal' ? saveInlineAbnormal : saveInlineHandover)(id);
  };
}

async function saveInline(type, id, data){
  if (!data.date || !data.store){
    showToast('請填寫日期與店家');
    return;
  }
  const row = rowsOf(type).find(r => r.id === id);
  if (row && row._remote){ markEditConflict(type, id); showToast('資料已在別處更新，請先選擇如何處理'); return; }
  try{
    setSyncState(type, 'loading');
    if (type === 'abnormal'){
      const codes = matchCustomerCodes(data.store);
      data.customerCode = codes.length === 1 ? codes[0] : (row ? row._code : null);
    }
    const updated = await updateRow(type, id, data, row ? row._rev : null);
    if (!updated){
      const { data: fresh } = await sb.from(TABLES[type]).select(COLS[type]).eq('id', id).maybeSingle();
      if (!fresh) { setSyncState(type, 'error'); showToast('沒有修改權限，或資料已被刪除'); return; }
      if (row){ row._remote = dbRowToAppRow(type, fresh); }
      markEditConflict(type, id);
      setSyncState(type, 'synced');
      showToast('資料已在別處更新，草稿已保留');
      return;
    }
    editing[type] = null;
    closeInlineEdits();
    upsertLocal(type, updated);
    renderType(type);
    setSyncState(type, 'synced');
    showToast(type === 'abnormal' ? '已更新異常紀錄' : '已更新交接紀錄');
  }catch(err){
    setSyncState(type, 'error');
    showToast('更新失敗（草稿已保留，可再按一次儲存）：' + err.message);
  }
}

async function deleteAbnormal(id){ await deleteOne('abnormal', id, '確定要刪除這筆異常紀錄嗎？'); }
async function deleteHandover(id){ await deleteOne('handover', id, '確定要刪除這筆交接紀錄嗎？'); }
async function deleteOne(type, id, msg){
  if (!ZXC.can.delete){ showToast('刪除只限管理員'); return; }
  if (!confirm(msg)) return;
  const before = rowsOf(type).slice();
  setRows(type, before.filter(r => r.id !== id));
  renderType(type);
  try{
    setSyncState(type, 'loading');
    await deleteRow(type, id);
    setSyncState(type, 'synced');
  }catch(err){
    setRows(type, before);                 // 復原
    renderType(type);
    setSyncState(type, 'error');
    showToast('刪除失敗：' + err.message);
  }
}

    if (error) throw new Error(error.message);
    showToast(`已刪除 ${label} ${data.deleted} 筆資料`);
    await reload(type);
  }catch(err){
    setSyncState(type, 'error');
    showToast('刪除失敗：' + err.message);
  }
}

function renderType(type){
  // 行內編輯列是 tbody 裡的一列：重繪前先拿下來，重繪後放回原位，使用者的草稿（DOM 輸入值）完整保留
  const tbodyId = type === 'abnormal' ? 'ab-tbody' : 'ho-tbody';
  const editRow = editing[type] ? document.querySelector(`#${tbodyId} > .inline-edit-row`) : null;
  if (editRow) editRow.remove();
  if (type === 'abnormal'){ renderAbnormal(abnormalRows); refreshStoreDatalist(); }
  else renderHandover(handoverRows);
  if (editRow){
    const anchor = document.querySelector(`#${tbodyId} > tr[data-${type === 'abnormal' ? 'ab' : 'ho'}-id="${editing[type]}"]`);
    if (anchor) anchor.after(editRow); else editing[type] = null;
  }
  const rows = rowsOf(type).filter(r => !r._pending);
  const v = view[type];
  const pre = type === 'abnormal' ? 'ab' : 'ho';
  document.getElementById(pre + '-count').textContent = rows.length + (v.hasMore ? '+' : '');
  document.getElementById(pre + '-range-label').textContent = rangeText(type);
  document.getElementById(pre + '-print-meta').textContent = `列印時間：${new Date().toLocaleString('zh-TW')}　共 ${rows.length} 筆`;
  const more = document.getElementById(pre + '-more');
  more.hidden = !v.hasMore;
  more.disabled = v.loading;
}

function actionButtons(type, r){
  if (r._pending) return '<span class="pending-label">儲存中…</span>';
  const edit = ZXC.can.write ? `<button class="btn btn-ghost" onclick="${type === 'abnormal' ? 'editAbnormal' : 'editHandover'}('${r['id']}')" aria-label="編輯">✎</button>` : '';

function restoreRange(type){

    const saved = JSON.parse(localStorage.getItem(RANGE_STORE_KEY + '-' + type) || 'null');
    if (saved && saved.preset){
      const v = view[type];
      v.preset = saved.preset;
      const r = saved.preset === 'custom' ? { from: saved.from, to: saved.to } : presetRange(saved.preset);
      v.from = r.from; v.to = r.to;
      return;
    }
  }catch(e){}
  const r = presetRange('today');
  view[type].from = r.from; view[type].to = r.to;
}

function wireRangeBar(type){
  const bar = document.getElementById(type === 'abnormal' ? 'ab-range' : 'ho-range');

const _origCloseInlineEdits = closeInlineEdits;
closeInlineEdits = function(){ editing.abnormal = null; editing.handover = null; _origCloseInlineEdits(); };

document.getElementById('ab-date').value = localISO(new Date());
document.getElementById('ho-date').value = localISO(new Date());

window.addEventListener('afterprint', () => {
  document.body.classList.remove('previewing');
});

ZX.boot({
  site: 'report',
  title: '異常表與交接表',
  logo: '../shared/logo.svg',
  onReady: async ctx => {
    sb = ctx.sb;
    ZXC = ctx;
    gateByRole();
    ['abnormal', 'handover'].forEach(t => { restoreRange(t); renderRangeBar(t); wireRangeBar(t); });
    syncer = zxSync.createSync({
      sb, sites: ['report'],
      onChange: onRemoteChange,
      onReset: refreshAll,
      onStatus: s => ZX.syncBadge(s)
    });
    await syncer.start(async () => { await Promise.all([refreshAll(), loadCustomerNames()]); });
  }
});
</script>
