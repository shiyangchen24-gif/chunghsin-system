<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經營月報</title>
<link rel="icon" href="../shared/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 28px 64px; display: flex; flex-direction: column; gap: 16px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 24px; }
  .top p { margin: 4px 0 0; color: var(--zx-text-2); font-size: 14px; }
  .top .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--zx-surface); border: 1px solid var(--zx-border); border-radius: var(--radius-card); box-shadow: var(--zx-shadow); padding: 20px; min-width: 0; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--zx-text-2); font-weight: 600; }
  .doc-head { display: none; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { border: 1px solid var(--zx-border); border-radius: 12px; padding: 14px; }
  .kpi span { display: block; color: var(--zx-text-2); font-size: 13px; }
  .kpi b { display: block; font: 700 24px/1.3 var(--font-body); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .kpi small { color: var(--zx-text-3); font-size: 12.5px; }
  .delta { display: inline-flex; padding: 1px 7px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .delta.good { background: var(--zx-primary-soft); color: var(--zx-primary-ink); }
  .delta.bad { background: #FDECEA; color: #B4231E; }
  .delta.flat { background: var(--zx-surface-2); color: var(--zx-text-2); }
  .points { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 14.5px; }
  .points b { color: var(--zx-text); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .chart { height: 220px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 8px; border-bottom: 1px solid var(--zx-border); text-align: left; }
  th { color: var(--zx-text-2); font-weight: 600; background: var(--zx-surface-2); font-size: 12.5px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--zx-text-2); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 18px; border-top: 2px solid; }
  .legend i.dash { border-top-style: dashed; }
  .muted { color: var(--zx-text-3); font-size: 13px; }
  .foot { color: var(--zx-text-3); font-size: 12px; text-align: center; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { main { padding: 16px 16px 48px; } }
  /* 列印：A4 直式，卡片改成細框、不分頁切斷區塊 */
  @page { size: A4 portrait; margin: 12mm; }
  @media print {
    main { max-width: none; padding: 0; gap: 10px; }
    .top, .no-print, .zx-env-dev { display: none !important; }
    .doc-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #15805A; padding-bottom: 8px; }
    .doc-head img { width: 40px; height: 40px; }
    .doc-head h1 { margin: 0; font-size: 20px; }
    .doc-head p { margin: 0; font-size: 12px; color: #444; }
    .card { box-shadow: none !important; border: 1px solid #ccc !important; border-radius: 6px !important; padding: 12px; break-inside: avoid; }
    .kpi { padding: 8px; }
    .kpi b { font-size: 18px; }
    .chart { height: 180px; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 8px; }
    .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px; }
    .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 14px; }
    table { font-size: 11.5px; } th, td { padding: 5px 6px; }
    .points { font-size: 12.5px; line-height: 1.7; }
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/zx-nav.js" data-site="monthly" data-root="../"></script>
<script src="../shared/zx-config.js"></script>
<script src="../shared/zx-sync.js"></script>
<script src="../shared/zx-auth.js"></script>
<script src="../shared/zx-charts.js"></script>
<main>
  <header class="top">
    <div><h1>經營月報</h1><p>叫貨、異常、報價的月度摘要，可直接列印或存成 PDF 交給老闆</p></div>
    <div class="right">
      <label class="muted" for="month">月份</label>
      <input class="zx-input" type="month" id="month">
      <button class="zx-btn zx-btn--primary" type="button" id="print">列印／存成 PDF</button>
      <span id="zx-sync-badge" class="sync-badge" data-state="pending" role="status" aria-live="polite">連線中…</span>
      <span id="zx-user-chip"></span>
    </div>
  </header>

  <div class="doc-head"><img src="../shared/logo.svg" alt=""><div><h1 id="doc-title">忠欣蔬果 經營月報</h1><p id="doc-sub"></p></div></div>

  <section class="card"><h2>本月重點</h2><ul class="points" id="points"><li class="muted">讀取中…</li></ul></section>

  <section class="card"><h2>關鍵數字</h2><div class="kpis" id="kpis"></div></section>

  <section class="card">
    <h2>每日叫貨家數</h2>
    <div class="legend" aria-hidden="true"><span><i style="border-color:#15805A"></i>已叫貨</span><span><i class="dash" style="border-color:#C2410C"></i>未叫貨</span></div>
    <div class="chart" id="tick-chart" role="img"></div>
  </section>

  <section class="card">
    <h2>異常狀態分析</h2>
    <div class="grid3">
      <div><h3>異常類別</h3><div id="ab-cat"></div></div>
      <div><h3>處理方式</h3><div id="ab-ex"></div></div>
      <div><h3>責任歸屬</h3><div id="ab-resp"></div></div>
    </div>
  </section>

  <div class="grid2">
    <section class="card"><h2>異常最多的店家</h2><div id="ab-stores"></div></section>
    <section class="card"><h2>異常最多的車號</h2><div id="ab-cars"></div></section>
  </div>

  <div class="grid2">
    <section class="card"><h2>叫貨率最低的客戶</h2><p class="muted" style="margin:-6px 0 10px">可能有流失風險，建議業務聯繫</p><div id="low"></div></section>
    <section class="card"><h2>目前連續未叫貨（≥ 3 個工作天）</h2><div id="streak"></div></section>
  </div>

  <section class="card"><h2>負責人別叫貨</h2><div id="owners"></div></section>

  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  'use strict';
  var esc = ZXCharts.esc, C_ORD = '#15805A', C_UN = '#C2410C', C_AB = '#C9302C';
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var sb, cur = null, prev = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function md(s, wd) { var d = new Date(s + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + (wd ? '（' + WD[d.getDay()] + '）' : ''); }
  function range(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    return { from: iso(new Date(y, m - 1, 1)), to: iso(new Date(y, m, 0)) };
  }
  function delta(c, p, upGood) {
    if (p == null) return '';
    if (!p) return c ? '' : '<span class="delta flat">持平</span>';
    var x = Math.round((c - p) / p * 100);
    if (!x) return '<span class="delta flat">持平</span>';
    return '<span class="delta ' + ((upGood ? x > 0 : x < 0) ? 'good' : 'bad') + '">' + (x > 0 ? '▲ ' : '▼ ') + Math.abs(x) + '%</span>';
  }
  function table(head, rows, empty) {
    if (!rows.length) return '<p class="muted">' + (empty || '這段期間沒有資料') + '</p>';
    return '<table><thead><tr>' + head.map(function (h) { return '<th' + (h.n ? ' class="n"' : '') + '>' + h.t + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td' + (head[i].n ? ' class="n"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table>';
  }
  function top(list, skip) { return list.filter(function (x) { return !skip || (x.k !== skip && x.k !== '未填'); }).sort(function (a, b) { return b.n - a.n; })[0]; }

  function render(ym) {
    var B = cur, P = prev, t = B.tick, a = B.report, q = B.quote;
    var title = ym.slice(0, 4) + ' 年 ' + (+ym.slice(5)) + ' 月';
    document.getElementById('doc-title').textContent = '忠欣蔬果 ' + title + ' 經營月報';
    document.getElementById('doc-sub').textContent = '期間 ' + B.from + '～' + B.to + '・產生時間 ' + new Date(B.generated_at).toLocaleString('zh-TW');
    document.title = title + ' 經營月報';

    // 自動產生的重點摘要
    var pts = [];
    if (t.service_days) {
      pts.push('營業 <b>' + t.service_days + '</b> 天，平均每天 <b>' + t.avg_ord + '</b> 家叫貨（叫貨率 <b>' + t.avg_rate + '%</b>）' +
        (P && P.tick.avg_rate != null ? '，上月 ' + P.tick.avg_rate + '%' : '') + '。');
      if (t.best_day && t.worst_day) pts.push('叫貨最多是 ' + md(t.best_day.d, true) + '（' + t.best_day.ord + ' 家），最少是 ' + md(t.worst_day.d, true) + '（' + t.worst_day.ord + ' 家）。');
    } else pts.push('本月尚無已結束的營業日。');
    if (a.total) {
      var c = top(a.by_category), e = top(a.by_exchange), r = top(a.by_responsibility, '其他');
      pts.push('異常共 <b>' + a.total + '</b> 筆' + (P ? '（上月 ' + P.report.total + ' 筆）' + delta(a.total, P.report.total, false) : '') +
        '；最常見 <b>「' + esc(c.k) + '」</b> ' + c.n + ' 筆（' + Math.round(c.n / a.total * 100) + '%），處理方式以「' + esc(e.k) + '」為主' +
        (r ? '，責任歸屬最多為「' + esc(r.k) + '」' : '') + '。');
      if (a.top_stores[0]) pts.push('異常最多的店家是 <b>' + esc(a.top_stores[0].store) + '</b>（' + a.top_stores[0].n + ' 筆，多為' + esc(a.top_stores[0].top_category) + '），建議追蹤原因。');
    } else pts.push('本月沒有異常紀錄。');
    if (t.streak.length) pts.push('目前有 <b>' + t.streak.length + '</b> 家連續 3 個工作天以上未叫貨，最久為 ' + esc(t.streak[0].name) + '（' + t.streak[0].streak + ' 天）。');
    pts.push('報價匯出 <b>' + q.exports + '</b> 次，涵蓋 ' + q.customers + ' 位客戶、' + q.items + ' 個品項。');
    document.getElementById('points').innerHTML = pts.map(function (p) { return '<li>' + p + '</li>'; }).join('');

    var k = [
      ['營業日', t.service_days + ' 天', P ? '上月 ' + P.tick.service_days + ' 天' : ''],
      ['平均叫貨率', (t.avg_rate == null ? '—' : t.avg_rate + '%'), P && P.tick.avg_rate != null ? delta(t.avg_rate, P.tick.avg_rate, true) + ' 上月 ' + P.tick.avg_rate + '%' : ''],
      ['平均每日叫貨', (t.avg_ord == null ? '—' : t.avg_ord + ' 家'), '名單共 ' + t.customers + ' 家'],
      ['異常筆數', a.total + ' 筆', P ? delta(a.total, P.report.total, false) + ' 上月 ' + P.report.total + ' 筆' : ''],
      ['交接筆數', a.handover + ' 筆', P ? '上月 ' + P.report.handover + ' 筆' : ''],
      ['連續未叫 ≥3 天', t.streak.length + ' 家', '以今天為準'],
      ['報價匯出', q.exports + ' 次', q.customers + ' 位客戶'],
      ['匯出品項', q.items + ' 項', P ? '上月 ' + P.quote.items + ' 項' : '']
    ];
    document.getElementById('kpis').innerHTML = k.map(function (x) { return '<div class="kpi"><span>' + x[0] + '</span><b>' + x[1] + '</b><small>' + x[2] + '</small></div>'; }).join('');

    var R = t.days.map(function (d) { return { d: d.d, ord: d.ord, un: Math.max(0, t.customers - d.ord - d.no), no: d.no }; });
    ZXCharts.curve(document.getElementById('tick-chart'), R, {
      series: [{ key: 'ord', label: '已叫貨', end: '已叫', color: C_ORD, area: true }, { key: 'un', label: '未叫貨', end: '未叫', color: C_UN, dash: true }],
      unit: '家', empty: '本月尚無已結束的營業日',
      fmtX: function (p) { return md(p.d); }, title: function (p) { return md(p.d, true); },
      aria: function (R) { return '每日叫貨家數曲線圖，共 ' + R.length + ' 個營業日'; }
    });

    document.getElementById('ab-cat').innerHTML = ZXCharts.hbars(a.by_category, { color: C_AB });
    document.getElementById('ab-ex').innerHTML = ZXCharts.hbars(a.by_exchange, { color: C_AB });
    document.getElementById('ab-resp').innerHTML = ZXCharts.hbars(a.by_responsibility, { color: C_AB, sort: false });
    document.getElementById('ab-stores').innerHTML = table([{ t: '店家' }, { t: '主要類別' }, { t: '筆數', n: 1 }],
      a.top_stores.map(function (s) { return [esc(s.store), esc(s.top_category), s.n]; }));
    document.getElementById('ab-cars').innerHTML = table([{ t: '車號' }, { t: '筆數', n: 1 }],
      a.top_vehicles.map(function (v) { return [esc(v.car_no), v.n]; }));
    document.getElementById('low').innerHTML = table([{ t: '客戶' }, { t: '負責人' }, { t: '叫貨天數', n: 1 }, { t: '不叫天數', n: 1 }],
      t.low_customers.map(function (c) { return [esc(c.name), esc(c.fixed || '—'), c.ord_days + ' / ' + t.service_days, c.no_days]; }), '本月尚無已結束的營業日');
    document.getElementById('streak').innerHTML = table([{ t: '客戶' }, { t: '負責人' }, { t: '連續未叫', n: 1 }],
      t.streak.map(function (c) { return [esc(c.name), esc(c.fixed || '—'), c.streak + ' 天']; }), '目前沒有連續未叫貨的客戶');
    document.getElementById('owners').innerHTML = table([{ t: '負責人' }, { t: '客戶數', n: 1 }, { t: '累計叫貨（家・天）', n: 1 }, { t: '平均叫貨率', n: 1 }],
      t.by_owner.map(function (o) {
        var rate = t.service_days && o.customers ? Math.round(o.ord_days / (o.customers * t.service_days) * 1000) / 10 + '%' : '—';
        return [esc(o.fixed), o.customers, o.ord_days, rate];
      }));
    document.getElementById('foot').textContent = '忠欣蔬果有限公司・內部資料，請勿外流・資料來源：打勾單、異常表與交接表、報價單匯出系統';
  }

  async function load(ym) {
    var r = range(ym), pm = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 2, 1), pr = range(iso(pm).slice(0, 7));
    document.getElementById('points').innerHTML = '<li class="muted">讀取中…</li>';
    var res = await Promise.all([sb.rpc('boss_report', { p_from: r.from, p_to: r.to }), sb.rpc('boss_report', { p_from: pr.from, p_to: pr.to })]);
    if (res[0].error) { document.getElementById('points').innerHTML = '<li>讀取失敗：' + esc(res[0].error.message) + '</li>'; return; }
    cur = res[0].data; prev = res[1].error ? null : res[1].data;
    render(ym);
  }

  var month = document.getElementById('month');
  var now = new Date(); month.value = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  try { var q = new URLSearchParams(location.search).get('m'); if (/^\d{4}-\d{2}$/.test(q || '')) month.value = q; } catch (e) {}
  month.addEventListener('change', function () { if (sb && month.value) load(month.value); });
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (cur) render(month.value); }, 150); });
  window.addEventListener('beforeprint', function () { if (cur) render(month.value); });

  ZX.boot({
    site: 'monthly', title: '經營月報', logo: '../shared/logo.svg',
    onReady: async function (ctx) { sb = ctx.sb; ZX.syncBadge('live', '已連線'); await load(month.value); }
  });
})();
</script>
</body>
</html>
