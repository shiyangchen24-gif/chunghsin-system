<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裝置管理</title>
<link rel="icon" href="../shared/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 28px 64px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 4px 0 0; color: var(--zx-text-2); font-size: 14px; }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar .sp { flex: 1; }
  .switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .switch input { width: 40px; height: 22px; accent-color: var(--zx-primary); }
  .stat { color: var(--zx-text-2); font-size: 14px; }
  .stat b { color: var(--zx-text); font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--zx-border); vertical-align: top; }
  th { color: var(--zx-text-2); font-weight: 600; background: var(--zx-surface-2); font-size: 13px; }
  td.ip { font-family: var(--font-mono); font-size: 13px; }
  td .sub { color: var(--zx-text-3); font-size: 12.5px; margin-top: 2px; }
  tr.off td { color: var(--zx-text-3); }
  .chip { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
          background: var(--zx-primary-soft); color: var(--zx-primary-ink); }
  .chip.gray { background: var(--zx-surface-2); color: var(--zx-text-2); border: 1px solid var(--zx-border); }
  .chip.red { background: #FDECEA; color: #B4231E; }
  details summary { cursor: pointer; color: var(--zx-primary-ink); font-size: 12.5px; font-weight: 600; margin-top: 4px; }
  details ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--zx-text-2); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts .zx-btn { padding: 6px 10px; font-size: 13px; }
  .note { color: var(--zx-text-3); font-size: 13px; line-height: 1.6; }
  .empty { padding: 28px; text-align: center; color: var(--zx-text-3); }
  @media (max-width: 600px) { main { padding: 16px 16px 48px; } }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/zx-nav.js" data-site="devices" data-root="../"></script>
<script src="../shared/zx-config.js"></script>
<script src="../shared/zx-sync.js"></script>
<script src="../shared/zx-auth.js"></script>
<main>
  <header>
    <div><h1>裝置管理</h1><p>以暱稱使用的裝置與帳號，最近上線時間與 IP（只限管理員）</p></div>
    <div class="right">
      <span id="zx-sync-badge" class="sync-badge" data-state="pending" role="status" aria-live="polite">連線中…</span>
      <span id="zx-user-chip"></span>
    </div>
  </header>

  <section class="zx-card bar">
    <label class="switch"><input type="checkbox" id="allow" disabled> 允許新裝置以暱稱使用</label>
    <span class="stat" id="stat"></span>
    <span class="sp"></span>
    <input class="zx-input" id="q" type="search" placeholder="搜尋暱稱或 IP" aria-label="搜尋暱稱或 IP">
    <button class="zx-btn" id="reload" type="button">重新整理</button>
  </section>

  <section class="zx-card table-wrap" style="padding:0">
    <table>
      <thead><tr><th>暱稱</th><th>類型</th><th>目前 IP</th><th>第一次 IP</th><th>最後上線</th><th>瀏覽器</th><th>操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">讀取中…</td></tr></tbody>
    </table>
  </section>
  <p class="note">IP 由 Supabase 的請求標頭取得（cf-connecting-ip → x-forwarded-for 第一段），代表該裝置連上網路的對外 IP；
    同一個公司網路下的多台裝置可能顯示相同 IP。停用後該裝置立即無法讀寫，重新開啟網頁會看到「已被停用」。</p>
</main>
<script>
(function () {
  'use strict';
  var sb, me, list = [];
  var esc = function (s) { return ZX.esc(s); };
  function fmt(t) {
    if (!t) return '—';
    var d = new Date(t), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function ago(t) {
    var m = Math.round((Date.now() - new Date(t)) / 60000);
    return m < 1 ? '剛剛' : m < 60 ? m + ' 分鐘前' : m < 1440 ? Math.round(m / 60) + ' 小時前' : Math.round(m / 1440) + ' 天前';
  }
  function ua(s) {
    if (!s) return '—';
    var os = /iPhone|iPad/.test(s) ? 'iOS' : /Android/.test(s) ? 'Android' : /Windows/.test(s) ? 'Windows' : /Mac OS/.test(s) ? 'macOS' : /Linux/.test(s) ? 'Linux' : '其他';
    var br = /Edg\//.test(s) ? 'Edge' : /Chrome\//.test(s) ? 'Chrome' : /Safari\//.test(s) ? 'Safari' : /Firefox\//.test(s) ? 'Firefox' : '瀏覽器';
    return os + '・' + br;
  }
  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var R = list.filter(function (d) {
      return !q || (d.nickname || '').toLowerCase().indexOf(q) > -1 || d.ips.some(function (i) { return i.ip.indexOf(q) > -1; });
    });
    var active = list.filter(function (d) { return d.is_active; }).length;
    var today = list.filter(function (d) { return Date.now() - new Date(d.last_seen) < 864e5; }).length;
    document.getElementById('stat').innerHTML = '共 <b>' + list.length + '</b> 台・啟用 <b>' + active + '</b>・24 小時內上線 <b>' + today + '</b>';
    document.getElementById('rows').innerHTML = R.length ? R.map(function (d) {
      var self = d.user_id === me;
      return '<tr class="' + (d.is_active ? '' : 'off') + '" data-id="' + esc(d.user_id) + '">' +
        '<td><b>' + esc(d.nickname) + '</b>' + (self ? ' <span class="chip gray">我</span>' : '') +
          '<div class="sub">來過 ' + d.visits + ' 次</div></td>' +
        '<td>' + (d.is_account ? '<span class="chip gray">帳號・' + esc(d.role === 'admin' ? '管理員' : d.role === 'viewer' ? '唯讀' : '一般') + '</span>' : '<span class="chip">暱稱裝置</span>') +
          (d.is_active ? '' : ' <span class="chip red">已停用</span>') + '</td>' +
        '<td class="ip">' + esc(d.last_ip || '—') +
          (d.ips.length > 1 ? '<details><summary>' + d.ips.length + ' 個 IP 紀錄</summary><ul>' + d.ips.map(function (i) {
            return '<li>' + esc(i.ip) + '（' + i.visits + ' 次，最後 ' + fmt(i.last_seen) + '）</li>';
          }).join('') + '</ul></details>' : '') + '</td>' +
        '<td class="ip">' + esc(d.first_ip || '—') + '<div class="sub">' + fmt(d.first_seen) + '</div></td>' +
        '<td>' + fmt(d.last_seen) + '<div class="sub">' + ago(d.last_seen) + '</div></td>' +
        '<td>' + esc(ua(d.user_agent)) + '</td>' +
        '<td><div class="acts">' +
          '<button class="zx-btn" type="button" data-act="rename">改暱稱</button>' +
          (self ? '' : '<button class="zx-btn' + (d.is_active ? '' : ' zx-btn--primary') + '" type="button" data-act="toggle">' + (d.is_active ? '停用' : '啟用') + '</button>') +
        '</div></td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty">' + (list.length ? '沒有符合的裝置' : '還沒有裝置紀錄') + '</td></tr>';
  }
  async function load() {
    var r = await sb.rpc('admin_list_devices');
    if (r.error) { document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="empty">讀取失敗：' + esc(r.error.message) + '</td></tr>'; return; }
    list = r.data;
    var s = await sb.from('app_settings').select('value').eq('key', 'nickname_access').maybeSingle();
    var allow = document.getElementById('allow');
    allow.checked = !s.data || s.data.value !== false; allow.disabled = false;
    render();
  }
  document.getElementById('rows').addEventListener('click', async function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var id = b.closest('tr').dataset.id, d = list.find(function (x) { return x.user_id === id; });
    var r;
    if (b.dataset.act === 'rename') {
      var n = (prompt('新的暱稱（最多 12 字）', d.nickname) || '').trim();
      if (!n) return;
      r = await sb.rpc('admin_set_device', { p_user_id: id, p_nickname: n });
    } else {
      if (d.is_active && !confirm('確定停用「' + d.nickname + '」？停用後這台裝置立即無法讀寫。')) return;
      r = await sb.rpc('admin_set_device', { p_user_id: id, p_active: !d.is_active });
    }
    if (r.error || !r.data.ok) alert('更新失敗：' + (r.error ? r.error.message : r.data.reason));
    load();
  });
  document.getElementById('allow').addEventListener('change', async function () {
    var r = await sb.from('app_settings').update({ value: this.checked }).eq('key', 'nickname_access');
    if (r.error) { alert('更新失敗：' + r.error.message); this.checked = !this.checked; }
  });
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('reload').addEventListener('click', load);

  ZX.boot({
    site: 'devices', title: '裝置管理', logo: '../shared/logo.svg', accountOnly: true,
    onReady: async function (ctx) {
      sb = ctx.sb; me = ctx.user.id;
      ZX.syncBadge('live', '已登入');
      if (ctx.member.role !== 'admin') {
        document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="empty">這個頁面只限管理員使用。<br><br>' +
          '<button class="zx-btn zx-btn--primary" type="button" id="as-admin">改用管理員帳號登入</button></td></tr>';
        // 暱稱裝置改登管理員帳號：這個瀏覽器之後會以帳號身分使用
        document.getElementById('as-admin').onclick = function () { sb.auth.signOut().finally(function () { location.reload(); }); };
        return;
      }
      await load();
    }
  });
})();
</script>
</body>
</html>
